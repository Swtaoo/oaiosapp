workflows:
  ios-dev:
    name: iOS Development Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.iosapp.oa"
        TEAM_ID: "25666J58ZR"
      ios_signing:
        distribution_type: development
        bundle_identifier: $BUNDLE_ID

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Check environment
        script: |
          flutter --version
          xcodebuild -version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install || true

      - name: Set code signing
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj
          echo "=== Export Options ==="
          cat /Users/builder/export_options.plist

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - zishengshi35@gmail.com
        notify:
          success: true
          failure: true
