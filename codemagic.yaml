workflows:
  ios-dev:
    name: iOS Development Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.iosapp.oa"
      ios_signing:
        distribution_type: development
        bundle_identifier: $BUNDLE_ID

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up local properties
        script: echo "flutter.minSdkVersion=21" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install || true

      - name: Set iOS deployment target
        script: |
          cd ios
          if [ ! -f Podfile ]; then
            flutter precache --ios
            flutter pub get
          fi

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-method development

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - zishengshi35@gmail.com
        notify:
          success: true
          failure: true
